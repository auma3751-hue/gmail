<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spam Gmail</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* กล่องหลัก */
.container {
    width: 100%;
    max-width: 520px;

    background: #050505;

    border: 1px solid #008cff;
    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 0 10px #008cff,
        0 0 30px rgba(0,140,255,0.5),
        inset 0 0 25px rgba(0,140,255,0.08);
}

/* หัวข้อ */
.title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;

    color: white;

    text-shadow:
        0 0 5px #008cff,
        0 0 15px #008cff,
        0 0 30px #008cff;

    margin-bottom: 28px;
}

/* กลุ่มช่อง */
.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;

    font-size: 15px;
    color: #9ed8ff;
}

/* input / textarea */
input,
textarea {
    width: 100%;

    background: #020202;
    color: white;

    border: 1px solid #0077ff;
    border-radius: 10px;

    padding: 14px;

    font-size: 16px;
    outline: none;

    box-shadow:
        0 0 8px rgba(0,140,255,0.3);

    transition: 0.25s;
}

input:focus,
textarea:focus {
    border-color: #00aaff;

    box-shadow:
        0 0 8px #008cff,
        0 0 20px rgba(0,140,255,0.5);
}

textarea {
    min-height: 180px;
    resize: vertical;
}

/* ตัวนับ */
.counter {
    text-align: right;
    margin-top: 6px;

    font-size: 13px;
    color: #777;
}

/* ปุ่ม */
button {
    width: 100%;

    margin-top: 8px;

    padding: 15px;

    border: 1px solid #009dff;
    border-radius: 10px;

    background: #006eff;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 10px #008cff,
        0 0 25px rgba(0,140,255,0.5);

    transition: 0.25s;
}

button:hover {
    background: #008cff;

    box-shadow:
        0 0 15px #008cff,
        0 0 35px #008cff;
}

button:active {
    transform: scale(0.98);
}

/* ข้อความสถานะ */
#status {
    display: none;

    margin-top: 18px;
    padding: 13px;

    text-align: center;

    border-radius: 10px;

    border: 1px solid #00aaff;

    color: #7fd3ff;

    background: rgba(0,140,255,0.08);

    box-shadow:
        0 0 10px rgba(0,140,255,0.5);
}

/* มือถือ */
@media (max-width: 500px) {

    .container {
        padding: 22px;
    }

    .title {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        SEND MESSAGE
    </div>

    <form
        id="messageForm"
        action="https://formsubmit.co/oovip050@gmail.com"
        method="POST"
    >

        <!-- ป้องกันหน้า FormSubmit เด้ง -->
        <input type="hidden" name="_captcha" value="false">

        <!-- ให้ส่งกลับมาหน้าเดิม -->
        <input
            type="hidden"
            name="_next"
            value="https://YOUR-GITHUB-USERNAME.github.io/YOUR-PAGE/"
        >

        <!-- หัวข้ออีเมล -->
        <input
            type="hidden"
            name="_subject"
            value="มีข้อความใหม่จากเว็บไซต์"
        >

        <!-- อีเมล -->
        <div class="form-group">

            <label for="email">
                อีเมล
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

        </div>

        <!-- จำนวน -->
        <div class="form-group">

            <label for="amount">
                จำนวน
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="กรอกจำนวน"
                min="1"
                required
            >

        </div>

        <!-- ข้อความ -->
        <div class="form-group">

            <label for="message">
                ข้อความ
            </label>

            <textarea
                id="message"
                name="message"
                maxlength="3000"
                placeholder="พิมพ์ข้อความที่ต้องการส่ง..."
                required
            ></textarea>

            <div class="counter">
                <span id="count">0</span> / 3000
            </div>

        </div>

        <!-- ปุ่ม -->
        <button type="submit" id="sendButton">
            ส่งข้อความ
        </button>

    </form>

    <!-- สถานะ -->
    <div id="status">
        ✓ ส่งสำเร็จ
    </div>

</div>


<script>

const form = document.getElementById("messageForm");

const message = document.getElementById("message");

const count = document.getElementById("count");

const button = document.getElementById("sendButton");

const status = document.getElementById("status");


/* ตัวนับข้อความ */
message.addEventListener("input", function () {

    count.textContent = this.value.length;

});


/* ส่งฟอร์ม */
form.addEventListener("submit", async function (e) {

    e.preventDefault();

    button.disabled = true;

    button.textContent = "กำลังส่ง...";

    status.style.display = "none";


    try {

        const formData = new FormData(form);

        const response = await fetch(form.action, {

            method: "POST",

            body: formData,

            headers: {
                "Accept": "application/json"
            }

        });


        if (response.ok) {

            /* แสดงส่งสำเร็จ */
            status.textContent = "✓ ส่งสำเร็จ";
            status.style.display = "block";


            /* รีเซ็ตข้อมูลทั้งหมด */
            form.reset();

            count.textContent = "0";


            /* เปลี่ยนปุ่มกลับ */
            button.textContent = "ส่งข้อความ";

            button.disabled = false;


            /* ซ่อนข้อความหลัง 3 วินาที */
            setTimeout(function () {

                status.style.display = "none";

            }, 3000);

        } else {

            throw new Error("ส่งไม่สำเร็จ");

        }

    } catch (error) {

        status.textContent = "✕ ส่งไม่สำเร็จ กรุณาลองใหม่";
        status.style.display = "block";

        button.textContent = "ส่งข้อความ";
        button.disabled = false;

    }

});

</script>

</body>
  </html>
